<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cray.vc</title>
  <style>
    /* body background picked up from your logo art */
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0; /* Or #000 if video background is dark */
      overflow: hidden; /* Prevent scrollbars if video slightly overflows */
    }

    /* container to center and constrain video */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* make video scale responsively */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; /* Initially hidden */
      transition: opacity 0.5s ease-in-out;
    }

    video.loaded {
      opacity: 1;
    }

    /* Loading Spinner */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3; /* Light grey */
      border-top: 5px solid #3498db; /* Blue */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    footer {
      padding: 1rem;
      font-size: 0.9rem;
      text-align: center;
      color: #333;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (orientation: portrait) and (max-width: 768px) {
      video#bgVideo {
        object-position: center 30%; /* Adjusts video to show more of the top */
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <div class="loader" id="videoLoader"></div>
    <video
      id="bgVideo"
      src="logo.mp4"
      poster="logo_poster.png" 
      autoplay
      loop
      muted
      playsinline
    ></video>
  </div>



<script>
  document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('bgVideo');
    const loader = document.getElementById('videoLoader');

    // Show loader if video hasn't loaded metadata quickly
    if (video.readyState < 2) { // HAVE_METADATA or higher means dimensions are known
        loader.style.display = 'block';
    } else {
        loader.style.display = 'none'; // Already loaded
        video.classList.add('loaded');
    }

    video.addEventListener('canplay', function() {
      loader.style.display = 'none';
      video.classList.add('loaded');
    });

    // Fallback in case 'canplay' doesn't fire reliably or for already cached videos
    video.addEventListener('loadeddata', function() {
        if (video.readyState >= 2) { // HAVE_METADATA or more
            loader.style.display = 'none';
            video.classList.add('loaded');
        }
    });

    // If video errors
    video.addEventListener('error', function() {
        loader.style.display = 'none'; // Hide loader
        // Optionally display an error message or fallback content
        console.error('Video error:', video.error);
    });

  });
</script>
</body>
</html>
